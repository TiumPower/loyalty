# Tên miền cũ — 301 vĩnh viễn sang loyalty.tiumpower.com (giữ cert cũ để redirect
# trên HTTPS hợp lệ; DNS loyalty.czin.net + *.loyalty.czin.net phải vẫn trỏ về máy này).
server {
  listen 80;
  server_name loyalty.czin.net;
  return 301 https://loyalty.tiumpower.com$request_uri;
}
server {
  listen 80;
  server_name ~^(?<sub>[^.]+)\.loyalty\.czin\.net$;
  return 301 https://$sub.loyalty.tiumpower.com$request_uri;
}

server {
  listen 443 ssl http2;
  server_name loyalty.czin.net;
  ssl_certificate     /etc/letsencrypt/live/loyalty-wildcard/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/loyalty-wildcard/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
  return 301 https://loyalty.tiumpower.com$request_uri;
}
server {
  listen 443 ssl http2;
  server_name ~^(?<sub>[^.]+)\.loyalty\.czin\.net$;
  ssl_certificate     /etc/letsencrypt/live/loyalty-wildcard/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/loyalty-wildcard/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
  return 301 https://$sub.loyalty.tiumpower.com$request_uri;
}
