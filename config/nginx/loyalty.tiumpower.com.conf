upstream puma_loyalty { server unix:/var/www/loyalty/shared/tmp/sockets/puma.sock fail_timeout=0; }

server {
  listen 80;
  server_name loyalty.tiumpower.com *.loyalty.tiumpower.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name loyalty.tiumpower.com *.loyalty.tiumpower.com;

  ssl_certificate     /etc/letsencrypt/live/loyalty-tiumpower/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/loyalty-tiumpower/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

  root /var/www/loyalty/current/public;

  add_header X-Frame-Options SAMEORIGIN;
  add_header X-Content-Type-Options nosniff;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  # Sản phẩm chưa mở công khai: cấm mọi công cụ tìm kiếm lập chỉ mục.
  # Đi kèm public/robots.txt vẫn CHO Googlebot tải, vì bị chặn tải thì nó
  # không đọc được noindex và URL đã index sẽ nằm lại vĩnh viễn.
  # XOÁ 2 CHỖ (server + location /assets/) khi muốn mở công khai.
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

  client_max_body_size 20M;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;
  gzip_min_length 1000;

  location ^~ /assets/ { expires 1y; add_header Cache-Control public;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always; }

  location /cable {
    proxy_pass http://puma_loyalty;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
  }

  location @puma {
    proxy_pass http://puma_loyalty;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_read_timeout 120s;
  }

  try_files $uri @puma;
}
