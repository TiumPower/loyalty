# Tên cũ — 301 vĩnh viễn sang quenly.tiumpower.com (sản phẩm đổi tên thành Quenly
# 2026-09-30). KHÔNG khai báo `upstream` ở đây: khối upstream puma_loyalty nằm
# trong quenly.tiumpower.com.conf, khai hai lần thì nginx -t báo duplicate.
# Cert loyalty-tiumpower (*.loyalty.tiumpower.com) phải giữ để bắt tay TLS trước
# khi trả 301; DNS loyalty.tiumpower.com + *.loyalty.tiumpower.com vẫn trỏ máy này.
server {
  listen 80;
  server_name loyalty.tiumpower.com;
  return 301 https://quenly.tiumpower.com$request_uri;
}
server {
  listen 80;
  server_name ~^(?<sub>[^.]+)\.loyalty\.tiumpower\.com$;
  return 301 https://$sub.quenly.tiumpower.com$request_uri;
}

server {
  listen 443 ssl http2;
  server_name loyalty.tiumpower.com;
  ssl_certificate     /etc/letsencrypt/live/loyalty-tiumpower/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/loyalty-tiumpower/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
  return 301 https://quenly.tiumpower.com$request_uri;
}
server {
  listen 443 ssl http2;
  server_name ~^(?<sub>[^.]+)\.loyalty\.tiumpower\.com$;
  ssl_certificate     /etc/letsencrypt/live/loyalty-tiumpower/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/loyalty-tiumpower/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
  return 301 https://$sub.quenly.tiumpower.com$request_uri;
}
