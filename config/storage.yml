test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Cloudflare R2 — S3-compatible, nên vẫn dùng service S3 với endpoint riêng.
# Chuyển từ DigitalOcean Spaces sang R2 ngày 2026-10-02; khối này chạy được với
# nhà cung cấp S3-compatible khác chỉ bằng cách đổi R2_ENDPOINT và R2_REGION.
#
# TÊN SERVICE CỐ Ý GIỮ `spaces` / `spaces_mirrored` dù kho không còn là DO
# Spaces: cột `service_name` của mọi blob đã lưu đúng hai chuỗi này. Đổi tên
# block là mọi tệp cũ hết đọc được.
#
# Bucket dùng CHUNG với các app khác trên cùng server, nên mỗi app ghi vào tiền
# tố riêng (xem lib/active_storage/service/prefixed_s3_service.rb).
spaces:
  service: PrefixedS3
  prefix: <%= ENV.fetch("R2_PREFIX", "loyalty") %>
  access_key_id:     <%= ENV["R2_KEY"] %>
  secret_access_key: <%= ENV["R2_SECRET"] %>
  region:            <%= ENV.fetch("R2_REGION", "auto") %>
  bucket:            <%= ENV.fetch("R2_BUCKET", "tiumpower") %>
  endpoint:          <%= ENV.fetch("R2_ENDPOINT") { "https://#{ENV['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com" } %>
  # R2 chỉ có MỘT endpoint cho cả tài khoản, tên bucket nằm trong đường dẫn.
  force_path_style:  true
  # Tệp để RIÊNG TƯ; app phát đường dẫn ký tên có hạn khi cần tải.
  public: false

# R2 là kho chính, đĩa máy chủ là bản sao — bản sao lưu hằng đêm đóng gói
# shared/storage, nên vẫn cần tệp nằm trên đĩa để backup không rỗng.
spaces_mirrored:
  service: Mirror
  primary: spaces
  mirrors: [ local ]

# Use bin/rails credentials:edit to set the AWS secrets (as aws:access_key_id|secret_access_key)
# amazon:
#   service: S3
#   access_key_id: <%= Rails.application.credentials.dig(:aws, :access_key_id) %>
#   secret_access_key: <%= Rails.application.credentials.dig(:aws, :secret_access_key) %>
#   region: us-east-1
#   bucket: your_own_bucket-<%= Rails.env %>

# Remember not to checkin your GCS keyfile to a repository
# google:
#   service: GCS
#   project: your_project
#   credentials: <%= Rails.root.join("path/to/gcs.keyfile") %>
#   bucket: your_own_bucket-<%= Rails.env %>

# Use bin/rails credentials:edit to set the Azure Storage secret (as azure_storage:storage_access_key)
# microsoft:
#   service: AzureStorage
#   storage_account_name: your_account_name
#   storage_access_key: <%= Rails.application.credentials.dig(:azure_storage, :storage_access_key) %>
#   container: your_container_name-<%= Rails.env %>

# mirror:
#   service: Mirror
#   primary: local
#   mirrors: [ amazon, google, microsoft ]
