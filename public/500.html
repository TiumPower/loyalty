<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lỗi hệ thống · Quenly</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#FBF6EF; color:#3A2A20;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; padding:24px; }
    .box { text-align:center; max-width:420px; }
    .code { font-size:72px; font-weight:800; color:#B4402F; font-family:Georgia,serif; line-height:1; }
    h1 { font-size:22px; margin:12px 0 6px; }
    p { color:#7A6656; font-size:15px; }
    a { display:inline-block; margin-top:18px; background:#8C4A2F; color:#FFF7EE; text-decoration:none;
      padding:12px 22px; border-radius:14px; font-weight:600; }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">500</div>
    <h1>Có lỗi xảy ra</h1>
    <p>Hệ thống đang gặp sự cố. Chúng tôi sẽ khắc phục sớm — vui lòng thử lại sau.</p>
    <a href="/">Về trang chủ</a>
  </div>
</body>
</html>
